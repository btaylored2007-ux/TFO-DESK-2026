name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy requests yfinance beautifulsoup4 scikit-learn websocket-client
      - name: Desk suite (no secrets; non-localhost network blocked)
        env:
          TFO_TEST_OFFLINE: "1"
          SEC_USER_AGENT: "TFO-DESK CI paper research (no secret contact)"
          OANDA_PRACTICE_TOKEN: ""
          MASSIVE_API_KEY: ""
          COINALYZE_API_KEY: ""
        run: python -m pytest tests -q -p no:cacheprovider -rfE --continue-on-collection-errors
      - name: Veteran desk suite (no secrets; non-localhost network blocked)
        env:
          TFO_TEST_OFFLINE: "1"
          SEC_USER_AGENT: "TFO-DESK CI paper research (no secret contact)"
          VD_REVGUARD_WEBHOOK_DISABLE: "1"
        run: python -m pytest veteran_desk/tests -q -p no:cacheprovider -rfE --continue-on-collection-errors
