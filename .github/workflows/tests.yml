name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test dependencies
        run: python -m pip install pytest numpy pandas
      - name: tests and tests_watchlist
        run: python -m pytest tests tests_watchlist -q --tb=line -p no:cacheprovider
