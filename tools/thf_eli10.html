<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243E">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml"><title>Transparent Trading · Paper</title>
<style>
html,body{margin:0;height:100%;background:#f4f7f6;color:#142033;font:16px Inter,"Noto Sans","Segoe UI",sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;background:#10243e;color:#f4f7f6;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));flex:none}
.top svg{width:22px;height:22px;flex:none}
.top strong{font-size:16px;font-weight:600;letter-spacing:-.02em}
.top .sub{display:block;font-size:12px;font-weight:400;color:#c5d0d8}
.paper{border:1px solid #8fb8c4;color:#f4f7f6;border-radius:8px;font-size:11px;letter-spacing:.06em;padding:1px 6px;margin-left:6px}
.more{margin-left:auto;font-size:13px}
.more summary{cursor:pointer;list-style:none;color:#f4f7f6}
.more summary::-webkit-details-marker{display:none}
.more a{display:block;color:#10243e;background:#f4f7f6;padding:8px 10px;text-decoration:none}
.line{margin:0;padding:6px 12px;font-size:12px;color:#3e5160;background:#fff;border-bottom:1px solid #d5dee6;display:flex;justify-content:space-between;gap:8px;align-items:center;flex:none}
.line button{border:1px solid #d5dee6;background:#fff;color:#142033;border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}
main{flex:1;min-height:0;overflow:auto}
body[data-tab=chat] .line{display:none}
body[data-tab=chat] main{overflow:hidden;display:flex;flex-direction:column}
#dchat{flex:1;min-height:0}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #d5dee6;padding-bottom:max(4px,env(safe-area-inset-bottom))}
nav button{border:0;background:#fff;color:#3e5160;font:12px/1.2 Inter,"Noto Sans","Segoe UI",sans-serif;padding:8px 2px 6px;min-height:48px}
nav button[aria-current=page]{color:#10243e;font-weight:700;box-shadow:inset 0 2px 0 #10243e}
.hero,.panel{padding:12px}
.health{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;font-size:14px;line-height:1.35}
.health i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none;background:#8a5a12}
.health.green i{background:#1d5c38}.health.red i{background:#8c2f2f}.health.grey i{background:#3e5160}
.kicker{margin:8px 0 0;font-size:12px;color:#3e5160}
.num{margin:0;font-size:32px;font-weight:650;letter-spacing:-.03em}
.num.small{font-size:20px}
.meta,.counts{font-size:14px;color:#3e5160}
details{margin-top:8px}summary{cursor:pointer;color:#1f4e5f}
.row{padding:10px 0;border-bottom:1px solid #d5dee6}
.row b{display:block}.row span{color:#3e5160;font-size:13px}
.guide{margin:8px 12px 16px;font-size:14px;color:#3e5160}
</style></head><body data-tab="home">
<div class="app">
<header class="top">
<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2.5" y="2.5" width="27" height="27" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 11.5h14M16 11.5V22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
<div><strong>Transparent Trading</strong><span class="paper">PAPER</span><span class="sub">Paper trading engine. Not a live broker.</span></div>
<details class="more"><summary>More</summary><a href="/desk/chat">Chat full screen</a><a href="/classic">Previous page</a></details>
</header>
<p class="line"><span id="fresh">Waiting for the desk snapshot.</span><button type="button" id="reload">Refresh</button></p>
<main id="main"></main>
<nav aria-label="Desk">
<button type="button" data-tab="home">Home</button>
<button type="button" data-tab="trades">Trades</button>
<button type="button" data-tab="chat">Chat</button>
<button type="button" data-tab="seats">Seats</button>
<button type="button" data-tab="health">Health</button>
</nav>
</div>
<script>window.HOME0=<!--HOME0-->;window.SEAT0="<!--SEAT0-->";</script>
<!--ELI10_JS-->
</body></html>
